spring.application.name=gestor-obras-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gestor_obras
spring.datasource.username=postgres
spring.datasource.password=davifraile
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Upload de arquivos (orçamentos de fornecedores)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Porta do servidor
server.port=8080

# JWT — troque o secret por um valor longo e aleatório em produção
jwt.secret=3f8a2c1d7e4b9f6a0c5d2e8b1f3a7c4d9e6b0f2a5c8d1e4b7f0a3c6d9e2b5f8a
jwt.expiration=86400000